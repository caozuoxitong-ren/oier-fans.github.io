# ===== 额外配置 =====
extra:
  # 社交链接（显示在页面底部或侧边）
  social:
    - icon: fontawesome/solid/paper-plane   # 使用 FontAwesome 的纸飞机图标
      link: mailto:<admin@oier.fans>        # 点击后打开邮件客户端
      name: 联系邮箱                         # 链接的提示文字

  # 如果取消下面这行的注释，页面底部将不再显示
  # “Made with Material for MkDocs” 的生成标记
  # generator: false

# 这里配置所有要启用的 Markdown 扩展
markdown_extensions:
  # 允许在 Markdown 中使用属性列表，例如：
  # [链接](https://example.com){: target="_blank" rel="noopener" }
  # 也可以给标题、代码块等元素添加 class、id 等属性
  - attr_list

  # 启用数学公式支持，使用 pymdownx.arithmatex 扩展
  - pymdownx.arithmatex:
      # generic: true 表示输出通用的数学标记，不绑定特定渲染器，
      # 由前端 MathJax（或 KaTeX）负责最终渲染
      generic: true
      # 定义行内公式的分隔符，成对出现：开始符和结束符。
      # 这里同时支持 \( ... \) 和 $ ... $ 两种写法
      tex_inline_wrap: ['\(', '\)', '$', '$']
      # 定义块级公式的分隔符，成对出现：开始符和结束符。
      # 这里同时支持 \[ ... \] 和 $$ ... $$ 两种写法
      tex_block_wrap: ['\[', '\]', '$$', '$$']
  
  # 代码块增强，Mermaid 依赖它来识别自定义代码块
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# 额外加载的 JavaScript 文件，按顺序加载
extra_javascript:
  # 先加载自定义的 MathJax 配置脚本（位于 docs/javascripts/mathjax.js）
  - javascripts/mathjax.js
  # 再加载 MathJax 主库（从 CDN 获取），顺序不能反：必须先加载配置，再加载主库，否则配置不生效。
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

  # 加入 Mermaid 的加载脚本
  - javascripts/mermaid.js
  - javascripts/mermaid.min.js
  - javascripts/external-links.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js