# ===== 主题设置 =====
theme:
  # 使用 Material for MkDocs 主题
  name: material

  # 主题功能开关
  features:
    # 顶部导航栏以标签页形式展示（适合栏目较多的站点）
    - navigation.tabs
    # 默认展开左侧导航栏中的所有子项
    - navigation.expand

  # 界面语言设为中文
  language: 'zh'

  # 字体设置
  font:
    # 正文字体
    text: 'Fira Sans'
    # 代码块字体
    code: 'Fira Mono'

  # 配色方案（日间 / 夜间模式）
  palette:
    # --- 日间模式 ---
    - scheme: default          # default 表示浅色主题
      primary: white           # 主色调：白色
      accent: red              # 强调色：红色
      toggle:
        icon: material/weather-sunny   # 切换按钮图标（太阳）
        name: Switch to dark mode      # 鼠标悬停提示文字

    # --- 夜间模式 ---
    - scheme: slate            # slate 表示深色主题
      primary: black           # 主色调：黑色
      accent: teal             # 强调色：青色
      toggle:
        icon: material/weather-night   # 切换按钮图标（月亮）
        name: Switch to light mode     # 鼠标悬停提示文字

# ===== 底部版权信息 =====
