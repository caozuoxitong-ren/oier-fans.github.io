# ============================================================
# 主题设置
# ============================================================
theme:
  name: material

  features:
    # 顶部导航栏以标签页形式展示
    - navigation.tabs
    # 默认展开左侧导航栏中的所有子项
    - navigation.expand

  # 界面语言
  language: zh

  # 字体
  font:
    text: Fira Sans
    code: Fira Mono

  # 配色方案（日间 / 夜间）
  palette:
    # 日间模式
    - scheme: default
      primary: white
      accent: red
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode

    # 夜间模式
    - scheme: slate
      primary: black
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to light mode

