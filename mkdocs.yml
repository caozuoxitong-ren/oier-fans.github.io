# ============================================================
# 额外配置
# ============================================================
extra:
  social:
    - icon: fontawesome/solid/paper-plane
      link: mailto:<admin@oier.fans>
      name: 联系邮箱

  # 取消注释可隐藏“Made with Material for MkDocs”
  # generator: false

# ============================================================
# Markdown 扩展
# ============================================================
markdown_extensions:
  # 允许在 Markdown 中使用属性列表，例如：
  # [链接](https://example.com){: target="_blank" rel="noopener" }
  - attr_list

  # 数学公式支持（由前端 MathJax 渲染）
  - pymdownx.arithmatex:
      generic: true
      # 行内公式分隔符，成对出现：\( ... \) 和 $ ... $
      tex_inline_wrap: ['\(', '\)', '$', '$']
      # 块级公式分隔符，成对出现：\[ ... \] 和 $$ ... $$
      tex_block_wrap: ['\[', '\]', '$$', '$$']

  # 代码块增强，Mermaid 依赖它识别自定义代码块
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# ============================================================
# 额外加载的 JavaScript（按顺序加载）
# ============================================================
extra_javascript:
  # MathJax：先加载自定义配置（定义 window.MathJax），再加载主库
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

  # Mermaid：先加载主库（定义 window.mermaid），再加载初始化脚本
  - javascripts/mermaid.min.js
  - javascripts/mermaid.js

  # 让站外链接在新标签页打开
  - javascripts/external-links.js

  # 网站访问计数器
  - https://vercount.one/js